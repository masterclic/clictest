# Copy to .github/workflows/clictest-run.yml (Gitea: .gitea/workflows/) in the repository that runs tests.
# Started from the Actions tab ("Run workflow") or by the ClicTest configurator page (Run now).
name: ClicTest Run

on:
  workflow_dispatch:
    inputs:
      env-name:
        description: ClicTest environment
        required: true
      project-name:
        description: ClicTest project
        required: true
      test-suites:
        description: Test suites JSON (generate it with the ClicTest configurator)
        required: true
      username:
        description: ClicTest user (filled by the configurator; blank uses the CLICTEST_USER secret)
        required: false
      password:
        description: ClicTest password (filled by the configurator; blank uses the CLICTEST_PASSWORD secret)
        required: false

jobs:
  clictest:
    # Self-hosted runner instead: runs-on: [self-hosted, Windows]  (Windows needs Git for Windows for bash)
    runs-on: ubuntu-latest
    steps:
      - id: clictest
        # Gitea: http://gitea.smartintelectual.com:3000/smartintelectual/clictest-action@v1
        uses: masterclic/clictest@v1
        with:
          env-name: ${{ inputs.env-name }}
          project-name: ${{ inputs.project-name }}
          username: ${{ inputs.username || secrets.CLICTEST_USER }}
          password: ${{ secrets.CLICTEST_PASSWORD }}  # Run now password: read and masked by the action
          test-suites: ${{ inputs.test-suites }}
